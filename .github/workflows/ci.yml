name: ci

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # ADR-0074 rule 3: a published library may run its unit tests in CI, on ONE version. The
          # declared floor is the one that breaks (a newer syntax or stdlib call); the wheel smoke below
          # covers 3.12.
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - name: No unreviewed dimensional constant in solver code
        run: python scripts/check_unit_constants.py
      - run: python -m pytest tests -q
      - name: CI budget, trunk-only triggers, no training (ADR-0074)
        run: python scripts/check_ci_budget.py
  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: install the built wheel in a clean venv and import
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import spinoct; print(spinoct.__display_version__); from spinoct.units import self_check; self_check()"
