[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spinoct"
version = "0.18.0"
description = "Optimal control paths and energy-efficient switching pulses for classical spin dynamics (Landau-Lifshitz-Gilbert)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Felipe Santibanez-Leal", email = "fsantibanez@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
keywords = [
  "optimal-control",
  "magnetization-switching",
  "landau-lifshitz-gilbert",
  "spintronics",
  "spin-dynamics",
  "micromagnetics",
  "pulse-shaping",
  "energy-efficient-memory",
]

[project.urls]
Repository = "https://github.com/fsantibanezleal/CAOS_SpinOCT"

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The constrained solvers integrate the equation of motion in pure Python inside an optimization
# loop, so the tests that check their CONVERGED answers take tens of seconds each. They run in CI
# and can be skipped locally with `-m "not slow"`.
markers = ["slow: converged solver runs, tens of seconds each"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
